<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#8E4DFF"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#E6E9FF" stop-opacity=".9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1464" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- back page -->
  <g filter="url(#sh)">
    <rect x="300" y="210" width="400" height="520" rx="44" fill="#ffffff" opacity=".45" transform="rotate(-8 500 470)"/>
    <rect x="320" y="230" width="400" height="520" rx="44" fill="#ffffff"/>
    <rect x="382" y="320" width="200" height="30" rx="15" fill="#5B6CFF"/>
    <rect x="382" y="385" width="276" height="22" rx="11" fill="#C9CEFF"/>
    <rect x="382" y="435" width="240" height="22" rx="11" fill="#C9CEFF"/>
    <rect x="382" y="485" width="160" height="22" rx="11" fill="#C9CEFF"/>
  </g>
  <!-- magnifier -->
  <g filter="url(#sh)">
    <line x1="700" y1="700" x2="800" y2="800" stroke="#1f1a5c" stroke-width="64" stroke-linecap="round"/>
    <circle cx="610" cy="610" r="150" fill="url(#lens)" stroke="#1f1a5c" stroke-width="44"/>
    <path d="M540 570 a90 90 0 0 1 80 -50" stroke="#8E4DFF" stroke-width="22" fill="none" stroke-linecap="round"/>
  </g>
</svg>
