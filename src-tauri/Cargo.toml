[package]
name = "glance"
version = "0.5.2"
description = "Glance вЂ” Р»С‘РіРєРёР№ РїСЂРѕСЃРјРѕС‚СЂС‰РёРє DOCX, PPTX, XLSX Рё PDF"
edition = "2021"

[lib]
name = "glance_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
